<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortEarn Login</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b10;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  width:90%;
  max-width:380px;
  background:#1d202a;
  padding:25px;
  border-radius:20px;
}
h1{text-align:center}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  box-sizing:border-box;
  border:0;
  border-radius:10px;
  background:#292c38;
  color:white;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#ffd83d;
  font-weight:bold;
}
#signupBtn{
  background:#444;
  color:white;
}
#message{
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">
<h1>▶ ShortEarn</h1>
<p>Login or create an account</p>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>
<button id="signupBtn">Sign Up</button>

<p id="message"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3BdM2tMUGEKF7zuive4ufZXc9tGwc064",
  authDomain: "short-eran-b36b2.firebaseapp.com",
  projectId: "short-eran-b36b2",
  storageBucket: "short-eran-b36b2.firebasestorage.app",
  messagingSenderId: "180421607816",
  appId: "1:180421607816:web:c0929eff077f2ef7d6fa3d",
  measurementId: "G-02QWJYK2QR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");

document.getElementById("signupBtn").addEventListener("click", async () => {
  if (!email.value || !password.value) {
    message.innerText = "Please enter email and password.";
    return;
  }

  try {
    await createUserWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );
    message.innerText = "Account created successfully!";
  } catch (error) {
    message.innerText = error.message;
  }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  if (!email.value || !password.value) {
    message.innerText = "Please enter email and password.";
    return;
  }

  try {
    await signInWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );
    message.innerText = "Login successful!";
  } catch (error) {
    message.innerText = error.message;
  }
});
</script>

</body>
</html>
