<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortEarn - Watch & Earn</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b10;
  color:white;
  font-family:Arial,sans-serif;
}
.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#141720;<!-- Yahan Login aur Signup wala code paste karo -->

<header>

<header>
}
header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#171923;
}
.logo{
  font-size:22px;
  font-weight:bold;
}
.points{
  background:#292c38;
  padding:9px 13px;
  border-radius:20px;
  color:#ffd83d;
}
.page{
  padding-bottom:80px;
}
.card{
  margin:14px;
  background:#1d202a;
  border-radius:18px;
  overflow:hidden;
}
.video{
  height:400px;
  background:#252832;
  display:flex;
  align-items:center;
  justify-content:center;
}
.video video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.info{
  padding:15px;
}
.title{
  font-size:18px;
  font-weight:bold;
}
.small{
  color:#aaa;
  margin-top:6px;
  font-size:13px;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}
.earn{
  background:#ffd83d;
  color:#111;
  margin-top:14px;
}
.balance{
  margin:14px;
  padding:16px;
  background:#1d202a;
  border-radius:15px;
}
.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:480px;
  width:100%;
  background:#191b24;
  padding:10px;
  display:flex;
  justify-content:space-around;
}
.nav button{
  background:none;
  color:#bbb;
}
.notice{
  margin:14px;
  padding:12px;
  background:#252833;
  border-radius:12px;
  color:#bbb;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">ShortEarn</div>
  <div class="points">⭐ <span id="points">0</span></div>
</header>

<div class="page">

<div class="balance">
  <b>💰 Your Rewards</b>
  <div style="font-size:28px;margin-top:8px">
    <span id="balance">0</span> Points
  </div>
</div>

<div class="card">

<div class="video">
<video controls playsinline>
<source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
</video>
</div>

<div class="info">
<div class="title">🌿 Nature Short Video</div>
<div class="small">Video dekho aur 10 points earn karo.</div>

<button class="earn" onclick="earnPoints()">
Watch & Earn +10
</button>

</div>
</div>

<div class="notice">
⚡ Har eligible video ke baad points add honge.
</div>

</div>

<div class="nav">
<button>🏠 Home</button>
<button>🎁 Rewards</button>
<button onclick="location.href='Login.html'">👤 Login</button>
</div>

</div>

<script>
let balance = 0;

function earnPoints(){
  balance += 10;
  document.getElementById("balance").textContent = balance;
  document.getElementById("points").textContent = balance;
  alert("🎉 10 points added!");
}
</script>

</body>
</html>
