
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortEarn Signup</title>
<style>
body{background:#0b0b10;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#1d202a;padding:25px;border-radius:15px;width:85%;max-width:350px}
input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:8px;font-size:16px}
input{background:#292c38;color:white;border:1px solid #444}
button{background:#ffd83d;color:#111;border:0;font-weight:bold}
a{color:#ffd83d}
</style>
</head>
<body>
<div class="box">
<h2>Create ShortEarn Account</h2>
<form id="signupForm">
<input id="name" type="text" placeholder="Your name" required>
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required>
<button type="submit">Sign Up</button>
<p id="message"></p>
</form>
<p>Already have an account? <a href="Login.html">Login</a></p>
<a href="index.html">Back to Home</a>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxoTZSiV-fvtDJCTs-8dMjP7brXdeYodg",
  authDomain: "short-eran-8855a.firebaseapp.com",
  projectId: "short-eran-8855a",
  storageBucket: "short-eran-8855a.firebasestorage.app",
  messagingSenderId: "809304027508",
  appId: "1:809304027508:web:0d47eb0405d5632edefc21",
  measurementId: "G-3SHXVVMX1T"
};
const message=document.getElementById("message");
const form=document.getElementById("signupForm");

try {
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    message.textContent="Creating account...";
    try {
      const credential=await createUserWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
      await updateProfile(credential.user,{
        displayName:document.getElementById("name").value.trim()
      });
      message.textContent="Account created! You can now log in.";
    } catch(error) {
      message.textContent=error.message;
    }
  });
} catch(error) {
  message.textContent="Firebase configuration needs to be completed.";
}
</script>
</body>
</html>
