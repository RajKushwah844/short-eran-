<title>ShortEarn - Watch & Earn</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b10;color:white;font-family:Arial,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;background:#12141b}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;background:#171923}
.logo{font-size:22px;font-weight:bold}
.points{background:#292c38;padding:9px 13px;border-radius:20px;color:#ffd83d}
.page{padding-bottom:80px}
.card{margin:14px;background:#1d202a;border-radius:18px;overflow:hidden}
.video{height:400px;background:#252832;display:flex;align-items:center;justify-content:center}
.video video{width:100%;height:100%;object-fit:cover}
.info{padding:15px}
.title{font-size:18px;font-weight:bold}
.small{color:#aaa;margin-top:6px;font-size:13px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer}
.earn{background:#ffd83d;color:#111;margin-top:14px}
.earn:disabled{opacity:.5}
.wallet{margin:14px;padding:20px;border-radius:18px;background:#20232e}
.balance{font-size:34px;color:#ffd83d;font-weight:bold;margin:8px 0}
.box{margin:14px;padding:16px;background:#1d202a;border-radius:15px}
input{width:100%;padding:13px;margin:8px 0;background:#292c38;border:1px solid #3a3d48;color:white;border-radius:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#191b24;display:flex;justify-content:space-around;padding:12px}
.nav button{background:none;color:#bbb}
.notice{margin:14px;padding:12px;background:#252833;border-radius:12px;color:#bbb;font-size:13px;line-height:1.5}
</style>
</head>
